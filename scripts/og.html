<!doctype html>
<!-- Imagen para compartir (src/assets/og.jpg, 600×600). Se genera con «npm run og».
     Cuadrada y sólo con el logo: WhatsApp y otras apps la muestran como miniatura pequeña y no hay nada que recortar. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Jost'; src: url('../node_modules/@fontsource-variable/jost/files/jost-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; }
  body { width: 600px; height: 600px; background: #f7f3ec; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .logo { width: 270px; margin-left: -18px; }
  .tag { margin-top: 34px; font: 500 15px/1 'Jost', sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: #4a1020; }
</style>
</head>
<body>
  <img class="logo" src="../marca/png/logo-vino-1200.png" alt="">
  <div class="tag">Barítono · Música antigua</div>
</body>
</html>
